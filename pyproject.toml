[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner-vols"
version = "0.1.0"
description = "Scanner de prix de vols (Duffel) : historisation, détection statistique, alertes Telegram."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests==2.34.2",
  "PyYAML==6.0.3",
  "python-dotenv==1.2.2",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.22",
  "mypy==2.3.0",
  "pre-commit==4.6.0",
  "types-requests==2.33.0.20260712",
  "types-PyYAML==6.0.12.20260518",
]

[tool.setuptools]
py-modules = ["scanner", "config", "storage", "detection", "alerting"]
packages = ["providers"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # longueur de ligne déléguée à ruff format

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = [
  "scanner.py",
  "config.py",
  "storage.py",
  "detection.py",
  "alerting.py",
  "providers",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
